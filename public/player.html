<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8D Adda — Live 8D Audio Radio | Hindi & Bollywood Songs (Use Headphones)</title>
<meta name="theme-color" content="#14100C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
/* Scrubber styles */
#orbitScrubber { cursor: grab; }
#orbitScrubber:active { cursor: grabbing; }
.rings-container {
  position: absolute; width: 100%; height: 100%;
  transition: transform 0.1s linear;
}
</style>
</head>
<body>

<!-- ============ MAIN APP SCREEN ============ -->
<section id="app" class="screen active">
  <div class="topbar">
    <div class="logo"><span class="dotmark"></span> 8D Adda</div>
    <div class="rotations" id="rotationTabs"></div>
    <div class="listeners"><span class="live-dot"></span> <span id="listenerCount">--</span> listening</div>
  </div>

  <div class="player-hero">
    <div class="orbit-wrap" id="orbitScrubber">
      <div class="rings-container" id="ringsContainer">
        <div class="ring r1"><span class="dot"></span></div>
        <div class="ring r2"><span class="dot" style="background:var(--gold);box-shadow:0 0 8px 1px rgba(201,162,75,0.5);"></span></div>
        <div class="ring r3"></div>
      </div>
      <div class="core" id="playPauseBtn">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
    </div>
    
    <span class="headphone-note" style="margin-bottom:20px; font-size:10px; padding:6px 12px;">
      <svg viewBox="0 0 24 24" style="width:12px; height:12px;"><path d="M12 3a9 9 0 0 0-9 9v7a2 2 0 0 0 2 2h2v-8H5v-1a7 7 0 0 1 14 0v1h-2v8h2a2 2 0 0 0 2-2v-7a9 9 0 0 0-9-9z"/></svg>
      8D Audio — Use Headphones
    </span>

    <div class="track-title" id="trackTitle">Loading...</div>
    <div class="track-meta" id="trackMeta">&nbsp;</div>
    <div class="tag-row" id="trackTags"></div>
  </div>

  <div class="content-wrap">
    <div class="section-label" id="playlistLabel">Up next</div>
    <div class="playlist" id="playlist">
      <div class="empty-state">Loading playlist...</div>
    </div>
  </div>

  <footer>
    8D Adda &middot; Live Radio &nbsp;&middot;&nbsp; <a href="/admin.html">Admin</a>
  </footer>
</div>

<!-- Request Song Button -->
<button class="request-fab" onclick="document.getElementById('requestModal').classList.add('active')">
  <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
  Request Song
</button>

<!-- Request Song Modal -->
<div class="modal-overlay" id="requestModal" onclick="if(event.target===this) this.classList.remove('active')">
  <div class="admin-card" style="max-width:300px;">
    <h2>Request a Song</h2>
    <div class="sub" style="margin-bottom:16px;">We play requests in the "On Request" station.</div>
    <div class="field">
      <input type="text" id="requestInput" placeholder="Song name & artist..." autocomplete="off">
    </div>
    <div class="form-error" id="requestError"></div>
    <div class="upload-status" id="requestSuccess" style="display:none; text-align:center; font-weight:500; margin-bottom:10px;"></div>
    <button class="btn-signin" onclick="submitRequest()" id="requestSubmitBtn">Submit Request</button>
    <button class="btn-close" onclick="document.getElementById('requestModal').classList.remove('active'); document.getElementById('requestSuccess').style.display='none'; document.getElementById('requestInput').value='';">Cancel</button>
  </div>
</div>
</section>

<audio id="audioEl" preload="auto"></audio>

<script>
const API = '';
let rotations = [];
let currentRotation = null;
let currentSongId = null;
const audioEl = document.getElementById('audioEl');
const clientId = Math.random().toString(36).slice(2) + Date.now().toString(36);

// ====== SCRUBBER LOGIC ======
let isDragging = false;
let currentRotationAngle = 0;
let lastAngle = 0;
let dragTimer = null;

const wrap = document.getElementById('orbitScrubber');
const rings = document.getElementById('ringsContainer');

function getAngle(e) {
  const rect = wrap.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const ex = e.touches ? e.touches[0].clientX : e.clientX;
  const ey = e.touches ? e.touches[0].clientY : e.clientY;
  return Math.atan2(ey - cy, ex - cx) * 180 / Math.PI;
}

function startDrag(e) {
  if (e.target.closest('#playPauseBtn')) return;
  isDragging = true;
  lastAngle = getAngle(e);
}

function onDrag(e) {
  if (!isDragging || !audioEl.duration) return;
  
  const currentAngle = getAngle(e);
  let deltaAngle = currentAngle - lastAngle;
  if (deltaAngle > 180) deltaAngle -= 360;
  if (deltaAngle < -180) deltaAngle += 360;
  
  currentRotationAngle += deltaAngle;
  rings.style.transform = `rotate(${currentRotationAngle}deg)`;
  lastAngle = currentAngle;

  const timeDelta = (deltaAngle / 360) * 30; // 360 degrees = 30 seconds
  audioEl.currentTime = Math.max(0, Math.min(audioEl.duration, audioEl.currentTime + timeDelta));
  
  if (dragTimer) clearTimeout(dragTimer);
  dragTimer = setTimeout(() => { isDragging = false; }, 4000); // Wait 4s before snapping back
}

function stopDrag() {
  if (isDragging) {
     if (dragTimer) clearTimeout(dragTimer);
     dragTimer = setTimeout(() => { isDragging = false; }, 4000);
  }
}

wrap.addEventListener('mousedown', startDrag);
window.addEventListener('mousemove', onDrag);
window.addEventListener('mouseup', stopDrag);
wrap.addEventListener('touchstart', startDrag, {passive: true});
window.addEventListener('touchmove', onDrag, {passive: true});
window.addEventListener('touchend', stopDrag);
// =============================


async function loadRotations(){
  const res = await fetch(`${API}/api/rotations`);
  rotations = await res.json();
  const activeRes = await fetch(`${API}/api/rotations/active`);
  const { activeRotation } = await activeRes.json();
  currentRotation = activeRotation;
  
  // We don't hardcode classes anymore!
  // Find current rotation data to set its background
  const rotData = rotations.find(r => r.id === currentRotation) || rotations[0];
  if(rotData && rotData.bgImageUrl) {
    document.body.style.backgroundImage = `linear-gradient(to bottom, rgba(20, 16, 12, 0.4), var(--deepest)), url('${rotData.bgImageUrl}')`;
  }

  const tabsEl = document.getElementById('rotationTabs');
  tabsEl.innerHTML = '';
  rotations.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'rotation-tab' + (r.id === currentRotation ? ' active' : '');
    btn.textContent = r.name;
    btn.onclick = () => switchRotation(r.id);
    tabsEl.appendChild(btn);
  });
}

function switchRotation(id){
  currentRotation = id;
  document.querySelectorAll('.rotation-tab').forEach((el, i) => {
    el.classList.toggle('active', rotations[i].id === id);
  });
  
  const rotData = rotations.find(r => r.id === id);
  if(rotData && rotData.bgImageUrl) {
    document.body.style.backgroundImage = `linear-gradient(to bottom, rgba(20, 16, 12, 0.4), var(--deepest)), url('${rotData.bgImageUrl}')`;
  }
  
  loadLive();
}

async function loadLive(){
  const label = rotations.find(r => r.id === currentRotation)?.name || '';
  document.getElementById('playlistLabel').textContent = `Up next · ${label} rotation`;

  try {
    const res = await fetch(`${API}/api/live/${currentRotation}`);
    if (!res.ok) {
      document.getElementById('trackTitle').textContent = 'Nothing uploaded yet';
      document.getElementById('trackMeta').textContent = 'Add tracks to this rotation from the admin panel';
      document.getElementById('playlist').innerHTML = '<div class="empty-state">This rotation is empty.</div>';
      audioEl.pause();
      return;
    }
    const data = await res.json();
    renderNowPlaying(data.song, data.offsetSeconds);
    renderPlaylist(data.playlist, data.song.id);
  } catch (e) {
    console.error(e);
  }
}

function renderNowPlaying(song, offsetSeconds){
  if (song.id !== currentSongId) {
    currentSongId = song.id;
    document.getElementById('trackTitle').textContent = escapeHtml(song.title);
    document.getElementById('trackMeta').textContent = escapeHtml([song.film, song.year].filter(Boolean).join(' · '));
    const tagsEl = document.getElementById('trackTags');
    tagsEl.innerHTML = '';
    (song.tags || []).forEach(t => {
      const span = document.createElement('span');
      span.className = 'tag';
      span.textContent = escapeHtml(t);
      tagsEl.appendChild(span);
    });
    if (song.bpm) {
      const span = document.createElement('span');
      span.className = 'tag';
      span.textContent = escapeHtml(song.bpm) + ' bpm';
      tagsEl.appendChild(span);
    }

    const wasPlaying = !audioEl.paused;
    audioEl.src = song.fileUrl;
    
    const setTime = () => {
      audioEl.currentTime = offsetSeconds;
      if (wasPlaying || window.justEnded) {
        audioEl.play().catch(() => {});
        window.justEnded = false;
      }
    };

    if (audioEl.readyState >= 1) {
      setTime();
    } else {
      audioEl.addEventListener('loadedmetadata', function onLoaded() {
        audioEl.removeEventListener('loadedmetadata', onLoaded);
        setTime();
      });
    }
  } else {
    // If we're terribly out of sync with the broadcast AND they aren't dragging, force a seek
    if (!isDragging && Math.abs(audioEl.currentTime - offsetSeconds) > 3) {
      audioEl.currentTime = offsetSeconds;
    }
  }
}

function renderPlaylist(songs, nowPlayingId){
  const el = document.getElementById('playlist');
  if (!songs.length) {
    el.innerHTML = '<div class="empty-state">This rotation is empty.</div>';
    return;
  }
  el.innerHTML = '';
  songs.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'track-row' + (s.id === nowPlayingId ? ' now-playing' : '');
    const mins = Math.floor((s.duration || 0) / 60);
    const secs = String((s.duration || 0) % 60).padStart(2, '0');
    row.innerHTML = `
      <span class="track-num">${String(i + 1).padStart(2, '0')}</span>
      <div class="track-info">
        <div class="name">${escapeHtml(s.title)}</div>
        <div class="film">${escapeHtml([s.film, s.year].filter(Boolean).join(', '))}</div>
      </div>
      <span class="track-dur">${mins}:${secs}</span>
    `;
    el.appendChild(row);
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

document.getElementById('playPauseBtn').addEventListener('click', () => {
  if (audioEl.paused) audioEl.play().catch(() => {});
  else audioEl.pause();
});
audioEl.addEventListener('play', () => {
  document.getElementById('playIcon').innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
});
audioEl.addEventListener('pause', () => {
  document.getElementById('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
});

window.justEnded = false;
audioEl.addEventListener('ended', () => { 
  window.justEnded = true;
  loadLive(); 
});

async function loadListeners(){
  try {
    const res = await fetch(`${API}/api/listeners?clientId=${clientId}`);
    const { count } = await res.json();
    document.getElementById('listenerCount').textContent = count;
  } catch (e) {}
}

async function submitRequest() {
  const input = document.getElementById('requestInput');
  const errorEl = document.getElementById('requestError');
  const successEl = document.getElementById('requestSuccess');
  const btn = document.getElementById('requestSubmitBtn');
  
  const songName = input.value.trim();
  if(!songName) {
    errorEl.textContent = 'Please enter a song name.';
    errorEl.classList.add('active');
    return;
  }
  
  errorEl.classList.remove('active');
  btn.disabled = true;
  btn.textContent = 'Submitting...';
  
  try {
    const res = await fetch('/api/requests', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ songName })
    });
    const data = await res.json();
    if(res.ok) {
      input.value = '';
      successEl.textContent = 'Request sent successfully! 🎉';
      successEl.className = 'upload-status ok';
      successEl.style.display = 'block';
      setTimeout(() => {
        document.getElementById('requestModal').classList.remove('active');
        successEl.style.display = 'none';
      }, 2000);
    } else {
      errorEl.textContent = data.error || 'Failed to submit request.';
      errorEl.classList.add('active');
    }
  } catch(e) {
    errorEl.textContent = 'Network error.';
    errorEl.classList.add('active');
  }
  btn.disabled = false;
  btn.textContent = 'Submit Request';
}

setInterval(loadLive, 15000);
setInterval(loadListeners, 15000);

(async function init(){
  await loadRotations();
  await loadLive();
  await loadListeners();
})();
</script>
</body>
</html>
