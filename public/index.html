<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit — 8D audio, live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ============ WELCOME SCREEN ============ -->
<section id="welcome" class="screen active">
  <span class="eyebrow" style="margin-bottom:22px;">Orbit &middot; live 8D radio</span>
  <div class="orbit-wrap">
    <div class="ring r1"><span class="dot"></span></div>
    <div class="ring r2"><span class="dot" style="background:var(--gold);box-shadow:0 0 8px 1px rgba(201,162,75,0.5);"></span></div>
    <div class="ring r3"></div>
    <div class="core" onclick="window.location.href='/player.html'">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
  </div>
  <h1>Sound that moves<br><em>around</em> you.</h1>
  <p class="sub">A live station of 8D-processed tracks, rotating through the day. Nothing is on demand — you're tuning into whatever's playing right now.</p>
  <span class="headphone-note">
    <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9v7a2 2 0 0 0 2 2h2v-8H5v-1a7 7 0 0 1 14 0v1h-2v8h2a2 2 0 0 0 2-2v-7a9 9 0 0 0-9-9z"/></svg>
    Best with headphones on
  </span>
  <br>
  <a href="/player.html"><button class="btn-enter">Enter the room</button></a>
  <div class="welcome-foot" id="welcomeClock">loading time...</div>
</section>

<script>
function updateClock(){
  const now = new Date();
  const ist = new Date(now.getTime() + now.getTimezoneOffset() * 60000 + 5.5 * 3600000);
  const h = String(ist.getHours()).padStart(2,'0');
  const m = String(ist.getMinutes()).padStart(2,'0');
  document.getElementById('welcomeClock').textContent = `${h}:${m} IST`;
}
updateClock();
setInterval(updateClock, 30000);
</script>
</body>
</html>
